spring.application.name=ms-admin
server.port=9091

# MySQL local (XAMPP / Laragon). Desde Docker se llega al PC con host.docker.internal
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/bd_junta_admin?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
