spring.application.name=ms-reservas
server.port=9092

spring.datasource.url=jdbc:mysql://host.docker.internal:3306/bd_junta_reservas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Comunicación con ms-admin a través del gateway
api.base-url=http://api-gateway:9090
api.usuario.exists=/usuarios/%d/exists

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
